<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>{{ title }}</title>
  <link href="/static/css/styles.css" rel="stylesheet">
  <link href="/static/css/input.css" rel="stylesheet">
</head>

<body class="bg-gray-100 min-h-screen p-8">
  <div class="max-w-4xl mx-auto">
    <div class="text-center mb-10">
      <h1 class="text-4xl font-bold text-blue-600 tracking-wider">NetConfig</h1>
      <p class="text-gray-600 mt-2 text-lg">ระบบจัดการ Router อัตโนมัติผ่านเครือข่าย</p>
    </div>
    <div class="mx-auto p-6 w-full bg-white shadow-md rounded-2xl">
      <h2 class="text-xl font-semibold text-gray-800 mb-6">เพิ่มอุปกรณ์ใหม่</h2>
      <form id="device-form" class="flex flex-col space-y-6" method="post" action="/add">
        <div class="w-full">
          <label class="block text-sm font-medium text-gray-700 mb-2">IP Address</label>
          <input id="ip_address" name="ip_address" type="text" placeholder="เช่น 192.168.0.1"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg form-input focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="w-full">
          <label class="block text-sm font-medium text-gray-700 mb-2">Username</label>
          <input id="username" name="username" type="text" placeholder="ชื่อผู้ใช้"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg form-input focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="w-full">
          <label class="block text-sm font-medium text-gray-700 mb-2">Password</label>
          <input id="password" name="password" type="password" placeholder="รหัสผ่าน"
            class="w-full px-4 py-3 border border-gray-300 rounded-lg form-input focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="w-full pt-2">
          <button type="submit"
            class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-4 rounded-lg transition duration-200 shadow-md">
            เพิ่มอุปกรณ์
          </button>
        </div>
      </form>
    </div>
    <div class="mt-8 bg-white rounded-2xl shadow-md overflow-hidden">
      <div class="p-6 border-b">
        <h2 class="text-xl font-semibold text-gray-800">อุปกรณ์ทั้งหมด</h2>
      </div>
      <div class="overflow-x-auto">
        <table class="min-w-full divide-y divide-gray-200">
          <thead class="bg-gray-50">
            <tr>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">IP Address</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Username</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Password</th>
              <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">การจัดการ</th>
            </tr>
          </thead>
          <tbody id="device-tbody" class="bg-white divide-y divide-gray-200">
            {% for router in routers_list %}
            <tr class="hover:bg-gray-50 transition duration-150">
              <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ router.ip_address }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ router.username }}</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">••••••••</td>
              <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                <button class="text-blue-600 hover:text-blue-800 mr-3">แก้ไข</button>
                <button class="text-red-600 hover:text-red-800">ลบ</button>
              </td>
            </tr>
            {% endfor %}
          </tbody>
        </table>
      </div>
    </div>
  </div>
</body>

</html>
